name: Verify Harvey Domain

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DNS and site
        shell: bash
        run: |
          set -u
          domain="harveyhands.abrdns.com"
          echo 'A:'
          dig +short A "$domain" | sort
          echo 'AAAA:'
          dig +short AAAA "$domain" | sort
          echo 'CAA:'
          dig +short CAA "$domain" | sort
          echo 'TXT:'
          dig +short TXT "$domain" | sort
          echo 'HTTP:'
          curl -I --max-time 20 "http://$domain/" || true
          echo 'HTTPS:'
          curl -I --max-time 20 "https://$domain/" || true
